name: Daily South Africa Intelligence Update

on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate live intelligence briefing
        run: python update_briefing.py

      - name: Check for updated briefing
        id: changes
        run: |
          if git diff --quiet data/briefing.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated briefing
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefing.json
          git commit -m "Daily intelligence update"
          git push